name: Daily pipeline

# Daily: light weather refresh + dbt tests when raw data exists.
# Full BTS months update infrequently — use workflow_dispatch or weekly job for heavy ingest.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      use_sample:
        description: "Use synthetic BTS/weather instead of live downloads"
        type: boolean
        default: true
      run_train:
        description: "Retrain model after dbt"
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install package
        run: uv sync --all-groups

      - name: Ingest
        env:
          FLIGHT_DATA_DIR: ${{ github.workspace }}/data
          FLIGHT_DUCKDB_PATH: ${{ github.workspace }}/data/duckdb/flight_agent.duckdb
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.use_sample }}" = "false" ]; then
            # Live rolling incremental (local Actions runner lake)
            uv run flight ingest all --incremental
          else
            # Scheduled / default: short fixed sample window (configs date_range fixed bounds)
            # Skip auto-retrain — CI smoke uses the separate demo/train job when needed
            uv run flight ingest all --sample --fixed --full --no-retrain
          fi

      - name: dbt build
        env:
          FLIGHT_DATA_DIR: ${{ github.workspace }}/data
          FLIGHT_DUCKDB_PATH: ${{ github.workspace }}/data/duckdb/flight_agent.duckdb
        run: uv run flight dbt build

      - name: Train (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_train }}
        env:
          FLIGHT_DATA_DIR: ${{ github.workspace }}/data
          FLIGHT_DUCKDB_PATH: ${{ github.workspace }}/data/duckdb/flight_agent.duckdb
          FLIGHT_MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
          FLIGHT_MODEL_DIR: ${{ github.workspace }}/models/local
        run: uv run flight train --sample-limit 20000

      - name: Upload curated duckdb artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-warehouse
          path: data/duckdb/
          if-no-files-found: ignore
