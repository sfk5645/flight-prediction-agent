name: Daily weather refresh

# Daily: pull Open-Meteo hub weather through today → R2.
# BTS flight months stay on the weekly lake job; weather-only updates do not retrain.
# Serve reads stg_weather from raw/weather Parquet on R2 (no dbt rebuild required).

on:
  schedule:
    - cron: "0 12 * * *" # daily 12:00 UTC
  workflow_dispatch:
    inputs:
      use_sample:
        description: "Force synthetic weather (ignore live Open-Meteo / R2)"
        type: boolean
        default: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install package
        run: uv sync --all-groups

      - name: Refresh weather
        env:
          FLIGHT_DATA_DIR: ${{ github.workspace }}/data
          FLIGHT_DUCKDB_PATH: ${{ github.workspace }}/data/duckdb/flight_agent.duckdb
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.use_sample }}" = "true" ] || [ -z "${R2_ACCOUNT_ID:-}" ]; then
            echo "Sample/fixed weather smoke (no R2 secrets or forced sample)"
            uv run flight ingest weather --sample --fixed --full --bts-aligned
          else
            echo "Live weather → R2 through today (incremental; always refreshes current month)"
            uv run flight ingest weather --to-r2 --no-keep-local --incremental --through-today
          fi
