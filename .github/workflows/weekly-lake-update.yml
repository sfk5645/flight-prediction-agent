name: Weekly lake update

# Discover newly published BTS months, upload only missing partitions to R2,
# prune to retention_months. Weather is also refreshed through today here, but
# the dedicated daily weather workflow keeps Open-Meteo current between Mondays.
# When the BTS sliding window moves / new months land, auto-retrain runs dbt + train.
# Requires R2_* secrets. Falls back to sample ingest when secrets are absent.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      use_sample:
        description: "Force synthetic sample (ignore live BTS)"
        type: boolean
        default: false
      force_retrain:
        description: "Force dbt + train even if the window did not move"
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install package
        run: uv sync --all-groups

      - name: Restore prior model / train state
        uses: actions/cache@v4
        with:
          path: |
            models/local
            mlflow.db
          key: model-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            model-${{ github.ref_name }}-
            model-

      - name: Incremental ingest → R2 (+ auto-retrain)
        env:
          FLIGHT_DATA_DIR: ${{ github.workspace }}/data
          FLIGHT_DUCKDB_PATH: ${{ github.workspace }}/data/duckdb/flight_agent.duckdb
          FLIGHT_MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
          FLIGHT_MODEL_DIR: ${{ github.workspace }}/models/local
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${{ inputs.force_retrain }}" = "true" ]; then
            # Wipe train state so should_auto_retrain sees no prior window
            rm -f models/local/train_state.json
          fi
          if [ "${{ inputs.use_sample }}" = "true" ] || [ -z "${R2_ACCOUNT_ID:-}" ]; then
            echo "Using sample ingest (no R2 secrets or forced sample)"
            uv run flight ingest all --sample --incremental --retrain --train-sample-limit 20000
          else
            uv run flight ingest all --to-r2 --no-keep-local --incremental --retrain
          fi

      - name: Upload curated duckdb + model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lake-and-model
          path: |
            data/duckdb/
            models/local/
          if-no-files-found: ignore
