hubs:
  - LAX
  - JFK
  - ORD
  - DEN
  - ATL
  - IAD
  - DFW

# Ingest window for BTS (flight labels).
# mode: rolling — end = latest published BTS PREZIP month; start = retention window.
# mode: fixed  — use start_*/end_* below (demos, backfills, reproducible CI).
date_range:
  mode: rolling
  # Used when mode: fixed / CLI --fixed (demos & CI). Ignored for rolling end.
  start_year: 2024
  start_month: 1
  end_year: 2024
  end_month: 2

weather:
  # Daily Open-Meteo archive. through_today=true extends past BTS lag so serving
  # features stay fresh; BTS/labels still refresh weekly and retrain on that cadence.
  through_today: true
  # On incremental refresh, re-pull this many trailing days for late revisions.
  daily_lookback_days: 7
  timezone: America/New_York
  variables:
    - temperature_2m_mean
    - precipitation_sum
    - windspeed_10m_max
    - weathercode

model:
  target: arr_delay_15
  test_size: 0.2
  random_state: 42
  # After ingest, retrain when new BTS months land or the retention window slides.
  # Weather-only daily refreshes do NOT trigger retrain (labels unchanged).
  auto_retrain: true
  # false = train on all lake flights (hub↔spoke OK); true = both ends must be hubs.
  hub_pair_only: false
  # Reservoir-sample this many rows into pandas (full lake is ~10M+ and OOMs).
  train_rows: 800000
  # Pick probability cutoff that maximizes F1 on the time-based holdout.
  tune_threshold: true
  xgboost:
    n_estimators: 400
    max_depth: 7
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.85
    min_child_weight: 5
    reg_lambda: 1.0

sample:
  # Synthetic rows when BTS download is unavailable (demo / CI)
  rows_per_month: 800

# Sliding window: keep only this many months of BTS/weather in the lake + DuckDB.
# Older local partitions, R2 objects, and DuckDB rows are removed by `flight ingest prune`
# (also runs automatically after `flight ingest all`).
# Weather may extend a few months past the latest BTS month (through today).
retention_months: 48
