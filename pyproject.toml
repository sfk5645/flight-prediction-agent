[project]
name = "flight-agent"
version = "0.1.0"
description = "Flight delay prediction lakehouse with MLOps and an AI ops agent"
readme = "README.md"
authors = [
    { name = "sujaykandwal", email = "sujaykandwal@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.26.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "mlflow>=2.17.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.5.0",
    "streamlit>=1.40.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.32.0",
    "xgboost>=2.1.0",
]

[project.optional-dependencies]
drift = ["evidently>=0.4.0"]

[project.scripts]
flight = "flight_agent.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]
